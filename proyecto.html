    <style>
        :root {
            --azul-oscuro: #0a0e1a;
            --verde-neon: #39FF14;
            --negro: #050505;
            --blanco: #ffffff;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--azul-oscuro);
            color: var(--blanco);
        }

        /* NAVEGACIÓN */
        nav {
            display: flex;
            justify-content: space-between;
            padding: 15px 5%;
            background: var(--negro);
            border-bottom: 2px solid var(--verde-neon);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo { font-size: 1.8rem; font-weight: bold; color: var(--verde-neon); }

        /* PORTADA (HERO) */
        #portada {
            height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(rgba(10, 14, 26, 0.7), rgba(10, 14, 26, 0.7)), 
                        url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&q=80') center/cover;
        }

        h1 { font-size: 4.5rem; margin: 0; text-shadow: 0 0 15px var(--verde-neon); }

        .btn-principal {
            margin-top: 30px;
            padding: 18px 50px;
            font-size: 1.3rem;
            background: var(--verde-neon);
            color: black;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.4s;
        }

        /* SECCIÓN TIENDA */
        #tienda {
            display: none;
            padding: 40px 5%;
            background: #f4f4f4;
            color: #333;
            min-height: 100vh;
        }

        .categorias-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .btn-cat {
            padding: 10px 15px;
            background: var(--azul-oscuro);
            color: var(--verde-neon);
            border: 1px solid var(--verde-neon);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 3px;
        }

        .btn-cat:hover, .btn-cat.active {
            background: var(--verde-neon);
            color: black;
        }

        .grid-productos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card img { width: 100%; border-radius: 5px; margin-bottom: 10px; }
        .card h3 { font-size: 0.9rem; margin: 5px 0; color: #444; height: 35px; overflow: hidden; }
        .precio { color: #27ae60; font-size: 1.2rem; font-weight: bold; margin: 10px 0; }

        footer { padding: 30px; text-align: center; background: var(--negro); color: #666; }
    </style>
</head>

        function irTienda() {
            document.getElementById('portada').style.display = 'none';
            document.getElementById('tienda').style.display = 'block';
            window.scrollTo(0,0);
            renderFiltros();
            filtrar('Audífonos');
        }

        function irInicio() {
            document.getElementById('portada').style.display = 'flex';
            document.getElementById('tienda').style.display = 'none';
        }

        function renderFiltros() {
            const menu = document.getElementById('menu-filtros');
            menu.innerHTML = '';
            Object.keys(db).forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'btn-cat';
                btn.innerText = cat;
                btn.onclick = () => filtrar(cat);
                menu.appendChild(btn);
            });
        }

        function filtrar(categoria) {
            const lista = document.getElementById('lista-productos');
            lista.innerHTML = '';
            
            document.querySelectorAll('.btn-cat').forEach(b => {
                b.classList.remove('active');
                if(b.innerText === categoria) b.classList.add('active');
            });

            db[categoria].forEach(p => {
                lista.innerHTML += `
                    <div class="card">
                        <img src="https://via.placeholder.com/200x150/0a0e1a/39FF14?text=${p.n}" alt="img">
                        <h3>${p.n}</h3>
                        <p class="precio">${p.p}</p>
                    </div>
                `;
            });
